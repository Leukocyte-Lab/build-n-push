name: 'Build n Push'
description: "GitHub Action that build & push Leukocyte-Lab's Dockerfile"
author: 'jason8399'
inputs:
  ssh_private_key:
    description: 'Private SSH key to register in the SSH Agent'
    required: false
  username:
    description: Username used to log in to a Docker registry.
    required: false
  password:
    description: Password or personal access token used to log in to a Docker registry.
    required: false
  registry:
    description: Docker registry host. Defaults to GHCR; legacy hosts require an explicit value.
    required: false
    default: ghcr.io
  repository:
    description: Docker repository to tag the image with
    required: true
  tags:
    description: Comma-delimited list of tags. These will be added to the registry/repository to form the image's tags
    required: false
  path:
    description: Path to the build context
    required: false
    default: "."
  dockerfile:
    description: Path to the Dockerfile (Default is '{path}/Dockerfile')
    required: false
  ssh:
    description: Enable SSH to access private data in builds
    required: false
    default: false
  push:
    description: Explicitly publish only from a protected push, release or manual workflow event.
    required: false
    default: false
runs:
  using: 'docker'
  image: 'Dockerfile'
branding:
  color: 'blue'
  icon: 'anchor'
